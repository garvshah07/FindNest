<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Deep Charcoal & Obsidian -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2019" />
      <stop offset="50%" stop-color="#181310" />
      <stop offset="100%" stop-color="#0e0b09" />
    </linearGradient>

    <!-- FindNest Warm Terracotta & Amber Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7e40" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Accent Emerald Dot Gradient (FindNest Live Map Pin) -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Outer Glow Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#e0662b" stop-opacity="0.3" />
    </linearGradient>

    <radialGradient id="innerLight" cx="50%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#181310" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="2.5" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#innerLight)" />

  <!-- Modern Architectural Home Silhouette (FindNest Brand Emblem) -->
  <g filter="url(#shadow)">
    <!-- Pitched Roof Overhang -->
    <path d="M10 30L26 16L38 26.5" stroke="url(#primaryGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Left Main Building Body -->
    <path d="M14 28V46C14 47.1 14.9 48 16 48H33C34.1 48 35 47.1 35 46V35" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Modern Extension Wing -->
    <path d="M35 24H48C49.1 24 50 24.9 50 26V46C50 47.1 49.1 48 48 48H35" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Modern Chimney Structure -->
    <path d="M19 21V16H23V24.5" stroke="url(#primaryGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Warm Glowing Front Door Entrance -->
    <path d="M21 48V38C21 37.4 21.4 37 22 37H27C27.6 37 28 37.4 28 38V48" fill="url(#primaryGrad)" fill-opacity="0.3" stroke="url(#primaryGrad)" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Right Modern Windows (Architectural Glass Panes) -->
    <rect x="39" y="28" width="7" height="6" rx="1.5" fill="url(#primaryGrad)" fill-opacity="0.9" />
    <rect x="39" y="38" width="7" height="6" rx="1.5" fill="url(#primaryGrad)" fill-opacity="0.9" />

    <!-- Glowing Location Beacon Pin Dot (Upper Right) -->
    <circle cx="48" cy="14" r="3.5" fill="url(#emeraldGrad)" />
    <circle cx="48" cy="14" r="5.5" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.5" />
  </g>
</svg>